services:
  raffle:
    build: .
    image: picnic-raffle-manager
    container_name: picnic-raffle
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the SQLite database and backups on the host.
      - ./data:/data
    # A single worker keeps ticket assignment race-free on SQLite.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  # Optional PostgreSQL backend. To use it, set DATABASE_URL in .env to
  #   postgresql+psycopg2://raffle:raffle@postgres:5432/raffle
  # and start with:  docker compose --profile postgres up -d
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: raffle
      POSTGRES_PASSWORD: raffle
      POSTGRES_DB: raffle
    volumes:
      - ./pgdata:/var/lib/postgresql/data
